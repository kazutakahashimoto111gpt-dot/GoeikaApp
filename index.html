<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">
  <!-- 演奏中の連続タップによるページ拡大を抑止する。 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>音符アプリ</title>


  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="icon"
    type="image/png"
    href="./icons/favicon-48.png"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >



  <!-- PWA設定 -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="音符"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <link
    rel="apple-touch-icon"
    href="icons/apple-touch-icon.png"
  >

</head>


<body>

  <!-- スマホ横向き時も縦画面の配置を維持する。 -->

  <div id="portraitApp">

  <!-- 音符画像エリア -->

  <div id="imageArea">

    <!-- 画像とオーバーレイの座標系をそろえる。 -->
    <div id="noteStage">

      <img
        id="noteImage"
        src="note-keys-outward-sample-v5-octagon-transparent-15px-precise.png"
        alt="音符図"
        draggable="false"
      >


      <div id="notePressMarker"></div>



      <div id="flashMarker"></div>

    </div>



    <!-- キー変更コントローラー -->

    <div id="keyControl">

      <button
        id="keyDown"
        type="button"
      >
        −
      </button>


      <button
        id="keyDisplay"
        type="button"
        title="押すとキー0に戻ります"
      >
        0
      </button>


      <button
        id="keyUp"
        type="button"
      >
        ＋
      </button>

    </div>


  </div>

    <!-- アプリ情報 -->

  <button
    id="infoButton"
    type="button"
    aria-label="このアプリについて"
    title="このアプリについて"
  >
    ⓘ
  </button>


  <div
    id="infoOverlay"
    aria-hidden="true"
  >

    <div
      id="infoDialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="infoTitle"
    >

      <button
        id="infoCloseButton"
        type="button"
        aria-label="閉じる"
        title="閉じる"
      >
        ×
      </button>

      <h1 id="infoTitle">
        音符アプリ
      </h1>

      <p id="infoCacheName">
        キャッシュ名：<span id="cacheNameValue">確認中…</span>
      </p>

      <p>
        このアプリは<strong>PWA（Progressive Web App）</strong>です。
        対応ブラウザでは、ホーム画面への追加やアプリとしてのインストールができます。
      </p>

      <p id="infoDisclaimer">
        本アプリの利用により生じた損害について、作者は責任を負いかねます。
      </p>

      <p id="infoCopyright">
        © 2026 Kazutaka Hashimoto
      </p>

      <section id="viewportDebug" aria-label="画面計測値">
        <pre id="viewportDebugValues" aria-live="polite"></pre>
      </section>

    </div>

  </div>



  <!-- 新しいService Workerの準備完了後に表示する。 -->

  <button
    id="updateNotice"
    type="button"
  >

    <strong>
      更新があります
    </strong>

    <br>

    タップして更新

  </button>


  </div>



  <!-- script.jsが参照する音符データを先に読み込む。 -->

  <script src="notes.js"></script>


  <script src="script.js"></script>



  <!-- Service Worker -->

  <script>


    if (
      "serviceWorker" in navigator
    ) {


      navigator.serviceWorker
        .register("./sw.js")

        .then(registration => {


          const updateNotice =
            document.getElementById(
              "updateNotice"
            );


          let isUpdateApplying =
            false;


          console.log(
            "Service Workerを登録しました"
          );



          function showUpdateNotice() {

            updateNotice.style.display =
              "block";

          }



          function applyUpdate() {


            const waitingWorker =
              registration.waiting;


            if (
              isUpdateApplying ||
              !waitingWorker
            ) {

              return;

            }


            isUpdateApplying =
              true;


            updateNotice.disabled =
              true;


            updateNotice.textContent =
              "更新しています...";


            /*
              waiting中のService Workerへ、すぐ有効化するよう依頼する。
              事前キャッシュはインストール時点で完了しているため、
              更新中に必要なファイルを追加取得することはない。
            */
            waitingWorker.postMessage({
              type: "SKIP_WAITING"
            });

          }



          updateNotice.addEventListener(
            "click",
            applyUpdate
          );



          // 新しいキャッシュへ切り替えるため、制御移行後に一度だけ再読み込みする。
          navigator.serviceWorker.addEventListener(
            "controllerchange",

            function() {

              if (
                !isUpdateApplying
              ) {

                return;

              }


              window.location.reload();

            }
          );



          // ページ表示時点で待機中の更新があれば通知する。
          if (
            registration.waiting
          ) {

            showUpdateNotice();

          }



          registration.addEventListener(
            "updatefound",

            function() {


              const newWorker =
                registration.installing;


              if (
                !newWorker
              ) {

                return;

              }



              newWorker.addEventListener(
                "statechange",

                function() {


                  // controllerがある場合だけ、初回導入ではなく更新と判断する。
                  if (
                    newWorker.state ===
                      "installed" &&

                    navigator.serviceWorker.controller
                  ) {


                    // 演奏中の自動再読み込みを避け、利用者の操作後に更新する。
                    showUpdateNotice();

                  }


                }
              );


            }
          );


        })


        .catch(error => {


          console.error(
            "Service Workerの登録に失敗しました:",
            error
          );


        });


    }


  </script>


</body>

</html>
