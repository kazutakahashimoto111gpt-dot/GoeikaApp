<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
  >

  <title>音符アプリ with H.K.</title>


  <!-- =====================================
       HTMLの設定
       ===================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Webサイトのアイコン -->
  <link
    rel="icon"
    type="image/png"
    href="./icons/favicon-48.png"
  >

  <!-- Webサイトのテーマカラー -->
  <meta
    name="theme-color"
    content="#f5f0e6"
  >



  <!-- =====================================
       PWAとして起動するための設定
       ===================================== -->

  <!-- PWA標準の設定ファイル -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <!-- iPhoneのホーム画面で
       アイコン下に表示される名前 -->
  <meta
    name="apple-mobile-web-app-title"
    content="音符 with H.K."
  >

  <!-- iPhone / Safari向け -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <!-- 一般的なPWA向け -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <!-- iPhone用PWAアイコン -->
  <link
    rel="apple-touch-icon"
    href="icons/apple-touch-icon.png"
  >

</head>


<body>

  <!-- =====================================
     音声開始用オーバーレイ
     ===================================== -->

  <div id="audioStartOverlay">
    <div id="audioStartMessage">
      タップして開始
    </div>
  </div>


  <!-- =====================================
       鍵盤画像エリア
       ===================================== -->

  <div id="imageArea">

    <img
      id="noteImage"
      src="keyboard-chart.png"
      alt="初黄から十一までの25鍵の鍵盤図"
      draggable="false"
    >



    <!-- =====================================
         鍵の押下表示とタップ位置の光
         ===================================== -->

    <div id="keyPressMarker"></div>


    <div id="flashMarker"></div>



    <!-- =====================================
         キー変更コントローラー

         鍵盤の下へ配置し、
         まとめてレイアウトするため
         imageAreaの中に入れてある
         ===================================== -->

    <div id="keyControl">

      <button
        id="keyDown"
        type="button"
      >
        −
      </button>


      <button
        id="keyDisplay"
        type="button"
        title="押すとキー0に戻ります"
      >
        0
      </button>


      <button
        id="keyUp"
        type="button"
      >
        ＋
      </button>

    </div>


  </div>

    <!-- =====================================
       アプリ情報
       ===================================== -->

  <!--
    画面右上の小さな情報ボタン。

    普段の演奏画面をできるだけシンプルに保ち、
    アプリの説明や免責事項は必要なときだけ
    ダイアログで確認できるようにする。
  -->

  <button
    id="infoButton"
    type="button"
    aria-label="このアプリについて"
    title="このアプリについて"
  >
    ⓘ
  </button>


  <!--
    「このアプリについて」ダイアログ。

    初期状態ではCSSで非表示。
    情報ボタンを押したときだけ表示する。
  -->

  <div
    id="infoOverlay"
    aria-hidden="true"
  >

    <div
      id="infoDialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="infoTitle"
    >

      <button
        id="infoCloseButton"
        type="button"
        aria-label="閉じる"
        title="閉じる"
      >
        ×
      </button>

      <h1 id="infoTitle">
        音符アプリ with H.K.
      </h1>

      <p>
        音程確認・練習を目的としたアプリです。
      </p>

      <p>
        このアプリは<strong>PWA（Progressive Web App）</strong>です。
        対応ブラウザでは、ホーム画面への追加やアプリとしてのインストールができます。
        また、一度インストールすれば、オフラインでも利用できます。
      </p>

      <p id="infoDisclaimer">
        本アプリの利用により生じた損害について、作者は責任を負いかねます。
      </p>

      <p id="infoCopyright">
        © 2026 Kazutaka Hashimoto
      </p>

    </div>

  </div>



  <!-- =====================================
       アップデート通知
       
       普段はCSSで非表示にしておく。

       新しいService Workerの準備が
       完了したときだけJavaScriptから
       表示する。
       ===================================== -->

  <button
    id="updateNotice"
    type="button"
  >

    <strong>
      更新があります
    </strong>

    <br>

    タップして更新

  </button>



  <!-- =====================================
       JavaScript
       ===================================== -->


  <!--
    notes.jsを先に読む。

    script.jsではnotesに登録された
    音符データを使用するため。
  -->

  <script src="notes.js"></script>


  <!-- アプリ本体 -->

  <script src="script.js"></script>



  <!-- =====================================
       Service Worker
       ===================================== -->

  <script>


    // -------------------------------------
    // Service Worker対応ブラウザか確認
    // -------------------------------------

    if (
      "serviceWorker" in navigator
    ) {


      /*
        sw.jsをService Workerとして登録する。

        register()が成功すると、

        registration

        というService Workerを管理するための
        オブジェクトを受け取ることができる。
      */

      navigator.serviceWorker
        .register("./sw.js")

        .then(registration => {


          const updateNotice =
            document.getElementById(
              "updateNotice"
            );


          let isUpdateApplying =
            false;



          console.log(
            "Service Workerを登録しました"
          );



          // =================================
          // 更新通知を表示する関数
          // =================================

          function showUpdateNotice() {


            /*
              更新通知を表示する。

              普段はCSSによって

              display: none;

              になっている。
            */

            updateNotice.style.display =
              "block";

          }



          // =================================
          // 更新を適用する
          // =================================

          function applyUpdate() {


            const waitingWorker =
              registration.waiting;


            if (
              isUpdateApplying ||
              !waitingWorker
            ) {

              return;

            }


            isUpdateApplying =
              true;


            updateNotice.disabled =
              true;


            updateNotice.textContent =
              "更新しています...";


            /*
              waiting中のService Workerへ、すぐ有効化するよう依頼する。
              事前キャッシュはインストール時点で完了しているため、
              更新中に必要なファイルを追加取得することはない。
            */
            waitingWorker.postMessage({
              type: "SKIP_WAITING"
            });

          }



          updateNotice.addEventListener(
            "click",
            applyUpdate
          );



          /*
            新しいService Workerが制御を引き継いだら、
            新しいキャッシュを読むため画面を一度だけ再読み込みする。
          */
          navigator.serviceWorker.addEventListener(
            "controllerchange",

            function() {

              if (
                !isUpdateApplying
              ) {

                return;

              }


              window.location.reload();

            }
          );



          // =================================
          // すでに新版がwaitingの場合
          // =================================

          /*
            ページを開いた時点ですでに

            新しいService Workerが
            waiting状態になっている

            こともある。

            その場合はすぐ通知する。
          */

          if (
            registration.waiting
          ) {

            showUpdateNotice();

          }



          // =================================
          // 新しいService Workerを検出
          // =================================

          registration.addEventListener(
            "updatefound",

            function() {


              /*
                installingには、

                現在インストール中の
                新しいService Workerが入る。
              */

              const newWorker =
                registration.installing;


              if (
                !newWorker
              ) {

                return;

              }



              // -----------------------------
              // 新SWの状態変化を監視
              // -----------------------------

              newWorker.addEventListener(
                "statechange",

                function() {


                  /*
                    installed

                    になった時点で、

                    新しいService Workerの
                    インストールが完了している。


                    ただし、

                    初めてこのPWAを使ったときも
                    installedになる。


                    そこで、

                    navigator.serviceWorker.controller

                    が存在するか確認する。


                    controllerが存在する
                         ↓
                    すでに旧SWで動いている
                         ↓
                    今回installedになったものは
                    「更新版」と判断できる
                  */

                  if (
                    newWorker.state ===
                      "installed" &&

                    navigator.serviceWorker.controller
                  ) {


                    /*
                      新SWはwaiting状態になる。
                      通知をタップしたときだけ即時有効化するため、
                      演奏中に自動で再読み込みされることはない。
                    */

                    showUpdateNotice();

                  }


                }
              );


            }
          );


        })


        // -------------------------------------
        // Service Worker登録失敗
        // -------------------------------------

        .catch(error => {


          console.error(
            "Service Workerの登録に失敗しました:",
            error
          );


        });


    }


  </script>


</body>

</html>
